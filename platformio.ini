; 公式設定 (https://docs.m5stack.com/en/core/StickS3 の PlatformIO 節) に基づく。
; 公式との差分:
;   - M5Unified は GitHub HEAD ではなくレジストリ版に固定 (再現性のため)
;   - CORE_DEBUG_LEVEL は 5 → 1 (IMU のシリアル出力を読みやすくするため)
;   - M5PM1 ライブラリは未導入 (EXT_5V は M5Unified の M5.Power.setExtOutput で制御する)
[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@^0.3.0
    fastled/FastLED@^3.10.10
